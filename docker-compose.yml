services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-support-n8n
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:16
    container_name: support-automation-postgres
    restart: always
    environment:
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password
      POSTGRES_DB: support_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: ai-support-metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: support_analytics
      MB_DB_PORT: 5432
      MB_DB_USER: support_user
      MB_DB_PASS: support_password
      MB_DB_HOST: postgres
    depends_on:
      - postgres
    volumes:
      - metabase_data:/metabase-data

volumes:
  n8n_data:
  postgres_data:
  metabase_data: