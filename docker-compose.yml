services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-support-n8n
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n
  postgres:
    image: postgres:16
    container_name: support-automation-postgres
    restart: always
    environment:
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password
      POSTGRES_DB: support_analytics
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
volumes: 
  n8n_data:
  postgres_data: