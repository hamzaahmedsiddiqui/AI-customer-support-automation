name: Secret Scan

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for common secrets
        run: |
          if grep -R "sk-" . --exclude-dir=.git --exclude-dir=.github; then
            echo "Potential OpenAI API key found."
            exit 1
          fi

          if grep -R "apiKey" . --exclude-dir=.git --exclude-dir=.github; then
            echo "Potential API key field found."
            exit 1
          fi

          if grep -R "Bearer " . --exclude-dir=.git --exclude-dir=.github; then
            echo "Potential bearer token found."
            exit 1
          fi

          echo "No obvious secrets found."